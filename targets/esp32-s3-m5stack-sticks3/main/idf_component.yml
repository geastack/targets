# Registry versions are pinned to the ones dependencies.lock records. The build
# solves into its build directory (esp32/app_project.cmake), so a range would let
# a re-solve for another app's capabilities move them.
dependencies:
  # PCM <-> Opus at the WebRTC media-track boundary.
  78/esp-opus: '^1.0.5'
  espressif/esp_codec_dev: '==1.5.11'
  espressif/esp_websocket_client: '==1.7.0'
  # 1.5.0 requires LWIP IPv6 (sockaddr_in6); stay on 1.4.x like the other
  # boards since this target builds with CONFIG_LWIP_IPV6 off.
  espressif/esp_peer: '==1.4.2'
  idf:
    version: '>=5.3'
