# Always-required SDK dependencies. Optional SDKs are selected from
# gea-dependencies.json by the CLI capability analyzer.
dependencies:
  espressif/esp_lcd_co5300: '==2.2.0'
  # The BSP asks for espressif/button '^4'; pinned to the locked release so a
  # re-solve (a different app's capabilities) does not move it.
  espressif/button: '==4.2.1'
  # The board's touch controller is a CST9220 (Espressif's board definition,
  # esp-brookesia esp_mosaico_v1_2). It may run the HYN212 protocol, which the
  # CST9217 driver does not speak: touch then initializes and never reports.
  espressif/esp_lcd_touch_cst9220: '==0.1.1'
  espressif/esp_codec_dev: '==1.6.2'
  # Existing-bus, per-device API supports the two onboard magnetic sensors.
  espressif/bmm150: '1.1.0'
  esp_lcd_panel_io_additions: '^1'
  # board_power.cpp: the USB-C port is the S31's high-speed OTG controller, so
  # the console is a TinyUSB CDC interface.
  espressif/esp_tinyusb: '==2.3.0'
  # nand_mount.cpp: the board's SPI NAND as FAT storage at /nand.
  espressif/spi_nand_flash: '==1.4.4'
  espressif/spi_nand_flash_fatfs: '==1.1.2'
  idf:
    # ESP32-S31 exists only in ESP-IDF master (6.2-dev), as a preview target.
    version: '>=6.2.0-dev'
