# Always-required SDK dependencies. Optional SDKs are selected from
# gea-dependencies.json by the CLI capability analyzer.
dependencies:
  # host/mjpeg.cpp needs this header in main, not only gea_framework.
  espressif/esp_lcd_co5300: '==2.2.0'
  # Custom QSPI boards may select the existing SH8601 binding.
  espressif/esp_lcd_sh8601: '==2.0.1~1'
  esp_lcd_panel_io_additions: '^1'
  # chip_bindings/audio/es8311.cpp
  idf:
    version: '>=5.3'
